name: Atualizar Dashboard Black 26

on:
  schedule:
    - cron: '47 * * * *'    # de hora em hora no minuto 47 (o dash principal roda no :17)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install pandas requests openpyxl
      - name: Rodar gerador
        working-directory: black26
        run: python gerador_black26.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A black26/
          git diff --staged --quiet || git commit -m "Black 26 atualizado $(date +'%d/%m/%Y %H:%M')"
          git pull --rebase -q && git push
